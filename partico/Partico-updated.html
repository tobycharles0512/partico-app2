@media (prefers-reduced-motion:reduce){

}

<script>
// Improved pre-loader with better error handling
var _plTimer = null;
var _preloaderShown = true;
var _appLoaded = false;

function hidePreloader() {
  if (_appLoaded) return;
  _appLoaded = true;
  var pl = document.getElementById('pre-loader');
  if (pl && _preloaderShown) {
    pl.style.opacity = '0';
    setTimeout(function() {
      if (pl) pl.style.display = 'none';
      _preloaderShown = false;
    }, 400);
  }
}

function showPreloaderError(message) {
  var msg = document.getElementById('pre-loader-msg');
  if (msg) {
    msg.textContent = message;
    msg.style.color = '#ff6b6b';
  }
}

// Check if React loaded
if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
  showPreloaderError('Loading app dependencies... (may take a moment)');
}

// Monitor #root for React-rendered content
_plTimer = setInterval(function() {
  var r = document.getElementById('root');
  if (r && r.children && r.children.length > 0) {
    clearInterval(_plTimer);
    hidePreloader();
  }
}, 100);

// Timeout checks with progressive error messages
window.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      showPreloaderError('CDN failed to load — check your internet connection');
    }
  }, 2000);
});

// Check after 5s if app hasn't loaded
setTimeout(function() {
  if (!_appLoaded) {
    showPreloaderError('Taking longer than expected... Please refresh the page');
  }
}, 5000);

// Final fallback after 8s
setTimeout(function() {
  if (!_appLoaded) {
    showPreloaderError('⚠️ App failed to load. Please close and reopen the app.');
    var pl = document.getElementById('pre-loader');
    if (pl) {
      var btn = document.createElement('button');
      btn.textContent = '🔄 Refresh';
      btn.style.cssText = 'margin-top:16px;padding:10px 20px;background:#00ff41;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;';
      btn.onclick = function() { window.location.reload(); };
      pl.appendChild(btn);
    }
  }
}, 8000);
</script>
